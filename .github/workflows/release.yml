name: Release

on:
  push:
    branches: [main]

# One release run at a time, and never cancel one that is mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version PR / publish
    runs-on: ubuntu-latest
    # Never run on forks.
    if: github.repository == 'aradhyacp/zoom-chat-adapter'
    permissions:
      contents: write        # push the version branch, create tags and releases
      pull-requests: write   # open/update the "Version Packages" PR
      id-token: write        # npm Trusted Publishing (OIDC) + provenance
    steps:
      # Full history: the release step finds the commit that introduced the
      # published version with `git log -S`.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Trusted Publishing needs npm >= 11.5.1 and Node >= 22.14. No
      # `registry-url` on purpose: it makes setup-node write an .npmrc with a
      # placeholder NODE_AUTH_TOKEN, which can shadow the OIDC exchange.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Pin npm 11.x: trusted publishing needs >= 11.5.1, and npm 12 changed the
      # `npm info --json` shape that changesets reads to detect published versions.
      - name: Update npm
        run: npm install -g npm@11

      - name: Print toolchain versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm check
          pnpm typecheck
          pnpm test

      # No NPM_TOKEN anywhere: `changeset publish` calls `npm publish`, which
      # exchanges this job's OIDC identity for a short-lived publish credential.
      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
          # Commits made through the GitHub API are signed by GitHub, which
          # satisfies the verify-signed-commits workflow on the Version PR.
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Workaround for https://github.com/changesets/action/pull/545
          NPM_TOKEN: ""

      # `changeset publish` (v3) can publish to npm yet create no git tag at all
      # (it logs `Created git tags.` with an empty list), so a tag/release step
      # that depends on tags already existing on HEAD silently does nothing —
      # that is how 1.2.0 reached npm with no GitHub Release. Instead, derive
      # the tag from package.json and reconcile: if this version is on npm but
      # has no GitHub Release, create the tag and the release. Idempotent, so it
      # is safe on every push to main and also backfills a missed release.
      - name: Ensure git tag and GitHub Release for the published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="${name}@${version}"

          # Only release a version that is actually on npm (skips Version PR runs).
          published=$(npm view "${name}@${version}" version 2>/dev/null || true)
          if [ "$published" != "$version" ]; then
            echo "${tag} is not published to npm yet; nothing to release."
            exit 0
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists."
            exit 0
          fi

          # Tag the commit that introduced this version (the merged Version PR),
          # not whatever HEAD happens to be if later commits landed on main.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            commit=$(git log -n1 --first-parent --format=%H -S"\"version\": \"${version}\"" -- package.json)
            if [ -z "$commit" ]; then
              echo "::error::Could not find the commit that introduced ${version}."
              exit 1
            fi
            git tag "$tag" "$commit"
            git push origin "refs/tags/${tag}"
          fi

          awk -v v="$version" '/^## /{p=($2==v)} p' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$tag" --verify-tag --title "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          fi
