name: Release

on:
  push:
    branches: [main]

# One release run at a time, and never cancel one that is mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version PR / publish
    runs-on: ubuntu-latest
    # Never run on forks.
    if: github.repository == 'aradhyacp/zoom-chat-adapter'
    permissions:
      contents: write        # push the version branch, create tags and releases
      pull-requests: write   # open/update the "Version Packages" PR
      id-token: write        # npm Trusted Publishing (OIDC) + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Trusted Publishing needs npm >= 11.5.1 and Node >= 22.14. No
      # `registry-url` on purpose: it makes setup-node write an .npmrc with a
      # placeholder NODE_AUTH_TOKEN, which can shadow the OIDC exchange.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Pin npm 11.x: trusted publishing needs >= 11.5.1, and npm 12 changed the
      # `npm info --json` shape that changesets reads to detect published versions.
      - name: Update npm
        run: npm install -g npm@11

      - name: Print toolchain versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm check
          pnpm typecheck
          pnpm test

      # No NPM_TOKEN anywhere: `changeset publish` calls `npm publish`, which
      # exchanges this job's OIDC identity for a short-lived publish credential.
      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
          # Commits made through the GitHub API are signed by GitHub, which
          # satisfies the verify-signed-commits workflow on the Version PR.
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Workaround for https://github.com/changesets/action/pull/545
          NPM_TOKEN: ""

      # changesets/action only pushes tags and creates GitHub Releases when the
      # publish output contains `New tag:` lines. @changesets/cli v3 prints
      # `Created git tags:` instead, so the action sees nothing published and the
      # tags created by `changeset publish` are lost with the runner. Do it here:
      # tags exist on HEAD only when this run just published a release.
      - name: Push tags and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            version="${tag##*@}"
            git push origin "refs/tags/$tag"
            awk -v v="$version" '/^## /{p=($2==v)} p' CHANGELOG.md > release-notes.md
            gh release create "$tag" --verify-tag --title "$tag" --notes-file release-notes.md
          done
