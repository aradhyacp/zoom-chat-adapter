name: Docs

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
      - "turbo.json"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
      - "turbo.json"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site is deployed from Vercel, so CI only has to prove it builds
      # clean and that every internal link still resolves.
      # Blume only emits the sitemap and the .well-known agent files when it
      # knows the site URL, and CI has no host to detect it from. The value only
      # shapes absolute links in the build output; nothing is deployed from here.
      - run: pnpm --filter docs build
        env:
          DOCS_SITE: https://zoom-chat-adapter.vercel.app/
      - run: pnpm --filter docs validate
      # Every agent-facing artifact and the Accept: text/markdown routing the
      # build wires into its Vercel config — see apps/docs/scripts.
      - run: pnpm --filter docs verify
